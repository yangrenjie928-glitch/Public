server {
    listen 80;
    server_name china-cloud.ru www.china-cloud.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name china-cloud.ru www.china-cloud.ru;

    ssl_certificate /etc/letsencrypt/live/china-cloud.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/china-cloud.ru/privkey.pem;

    root /var/www/china-cloud/dist;
    index index.html;

    location /api/payments/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

